.avatar{

.role{margin:.4rem 0 0; text-align:center; font-weight:600}

ul{list-style:none; margin:0; padding:0; display:grid; gap:.9rem}
a.link{
  display:flex; flex-direction:column; gap:.1rem;
  padding:.9rem 1.1rem;
  background:var(--card); color:var(--ink);
  border:2px solid var(--line); border-radius:.9rem;
  box-shadow:4px 4px 0 var(--line);
  text-decoration:none;
  transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
a.link:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line); background:var(--accent); color:var(--accent-ink)}
a.link:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--line)}
a.link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.t{font-weight:800; font-size:1.05rem}
.d{font-size:.88rem; color:var(--muted)}
a.link:hover .d{color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}

.bar{margin-top:2rem;text-align:center}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:.7rem;padding:.45rem .9rem;font-weight:600}
button.go{background:var(--accent);color:var(--accent-ink);box-shadow:3px 3px 0 var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.8rem;display:grid;gap:.5rem;margin-bottom:.9rem}
.row .btns{display:flex;gap:.4rem;flex-wrap:wrap}
input,textarea{font:inherit;width:100%;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:.6rem;padding:.45rem .6rem}
label{font-size:.8rem;color:var(--muted);font-weight:600}
.msg{font-size:.9rem;color:var(--muted);margin:.6rem 0}
</style>

var ul = document.getElementById("links"), main = document.querySelector("main");

function el(tag, props, kids){

  if (/^[\w-]+(\.[\w-]+)+/.test(u)) return "https://" + u;
  return "#";

function render(){

}
async function save(){
